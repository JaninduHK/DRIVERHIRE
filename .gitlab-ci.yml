# GitLab CI/CD Pipeline for DRIVERHIRE
# On every push to `main`: lint, then auto-deploy to the VPS over SSH.
# The VPS runs the app with Docker Compose, so the deploy just syncs the code
# and runs `docker compose up -d --build`.

stages:
  - test
  - deploy

variables:
  NODE_VERSION: "20"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
    - backend/node_modules/

# ---------------------------------------------------------------------------
# TEST STAGE — fast sanity checks (deploy won't run if these fail)
# ---------------------------------------------------------------------------

lint:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run lint || true   # warnings shouldn't block a deploy
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:backend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd backend
    - npm ci --prefer-offline
    - node --check server.js
    - node --check config/database.js
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# DEPLOY STAGE — SSH to the VPS and rebuild the Docker stack
# ---------------------------------------------------------------------------
# Required CI/CD variables (Settings → CI/CD → Variables), pointed at the NEW VPS:
#   VPS_HOST         new VPS public IP or hostname
#   SSH_USER         SSH user on the VPS (e.g. root)
#   APP_PATH         repo directory on the VPS (e.g. /root/DRIVERHIRE)
#   SSH_PRIVATE_KEY  private key whose public key is in the VPS's ~/.ssh/authorized_keys
#                    (mark it "Protected", and prefer type "File")
# ---------------------------------------------------------------------------

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    - echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config
  script:
    - echo "Deploying to $SSH_USER@$VPS_HOST:${APP_PATH}"
    - |
      ssh "$SSH_USER@$VPS_HOST" "set -e; \
        cd '${APP_PATH}'; \
        git fetch origin main; \
        git reset --hard origin/main; \
        docker compose up -d --build; \
        docker image prune -f"
    - echo "Deployment complete."
  environment:
    name: production
    url: https://carwithdriver.lk
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success   # auto-deploy on every push to main
